# Test application properties (used by @SpringBootTest in test profile)
# Overrides application.yml for testing

# H2 in-memory database
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.flyway.enabled=false

# Security
bookstore.jwt.secret=test-jwt-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm
bookstore.jwt.issuer=bookstore-test
bookstore.security.bcrypt-strength=4

# Mock all external integrations
bookstore.agent.mock-mode=true
bookstore.payment.mock-mode=true
bookstore.email.mock-mode=true
bookstore.shipping.mock-mode=true

# Rate limiting relaxed for tests
bookstore.security.rate-limit.login-attempts=100
bookstore.security.rate-limit.agent-requests-per-minute=100
