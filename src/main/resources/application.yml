# ===================================================================
# Application Configuration
# ===================================================================
spring:
  application:
    name: agentic-bookstore

  # Database
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bookstore}
    username: ${SPRING_DATASOURCE_USERNAME:bookstore}
    password: ${SPRING_DATASOURCE_PASSWORD:bookstore123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # JPA
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public
        jdbc:
          time_zone: UTC
    open-in-view: false

  # Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  # Jackson
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

  # Cache
  cache:
    type: simple

  # Actuator
  security:
    filter:
      order: 1

# ===================================================================
# Server
# ===================================================================
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain

# ===================================================================
# Management (Actuator)
# ===================================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

# ===================================================================
# Logging
# ===================================================================
logging:
  level:
    root: INFO
    com.bookstore: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{correlationId}] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{correlationId}] %-5level %logger{36} - %msg%n"

# ===================================================================
# Bookstore Application Properties
# ===================================================================
bookstore:
  jwt:
    secret: ${JWT_SECRET:bookstore-jwt-secret-key-must-be-at-least-256-bits-long-for-hs256}
    access-token-expiry: ${JWT_ACCESS_TOKEN_EXPIRY:3600}    # seconds (1 hour)
    refresh-token-expiry: ${JWT_REFRESH_TOKEN_EXPIRY:86400} # seconds (24 hours)
    issuer: ${JWT_ISSUER:agentic-bookstore}

  security:
    bcrypt-strength: 12
    password-reset-token-expiry: 3600  # seconds
    rate-limit:
      login-attempts: 10
      login-window-seconds: 60
      agent-requests-per-minute: 20

  pagination:
    default-page-size: 20
    max-page-size: 100

  inventory:
    low-stock-threshold: ${LOW_STOCK_THRESHOLD:10}
    reservation-expiry-minutes: 30

  agent:
    max-iterations: 10
    timeout-seconds: 60
    max-tokens: 4096
    mock-mode: ${AGENT_MOCK_MODE:true}
    openai:
      api-key: ${OPENAI_API_KEY:mock-key}
      model: ${OPENAI_MODEL:gpt-4o-mini}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}

  payment:
    mock-mode: ${PAYMENT_MOCK_MODE:true}
    provider-url: ${PAYMENT_PROVIDER_URL:https://payment-provider.example.com}
    webhook-secret: ${PAYMENT_WEBHOOK_SECRET:webhook-secret-placeholder}

  email:
    mock-mode: ${EMAIL_MOCK_MODE:true}
    from-address: ${EMAIL_FROM:noreply@bookstore.example.com}
    from-name: "Bookstore"

  shipping:
    mock-mode: ${SHIPPING_MOCK_MODE:true}
    provider-url: ${SHIPPING_PROVIDER_URL:https://shipping-provider.example.com}

# ===================================================================
# OpenAPI / Swagger
# ===================================================================
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
  info:
    title: Agentic eCommerce Bookstore API
    description: REST API for an AI-powered bookstore backend
    version: 1.0.0
