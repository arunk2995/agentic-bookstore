# Test profile - uses H2 in-memory database
spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

  h2:
    console:
      enabled: false

bookstore:
  jwt:
    secret: test-jwt-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm
    access-token-expiry: 3600
    refresh-token-expiry: 86400
    issuer: bookstore-test

  security:
    bcrypt-strength: 4  # faster for tests
    rate-limit:
      login-attempts: 100
      login-window-seconds: 60
      agent-requests-per-minute: 100

  agent:
    mock-mode: true
    max-iterations: 5
    timeout-seconds: 30

  payment:
    mock-mode: true

  email:
    mock-mode: true

  shipping:
    mock-mode: true

logging:
  level:
    com.bookstore: DEBUG
    org.springframework.security: WARN
